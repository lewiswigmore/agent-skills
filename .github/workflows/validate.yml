name: Validate Skills
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check skill structure
        run: |
          errors=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            echo "::group::Validating $skill_name"

            # SKILL.md must exist
            if [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "::error::$skill_name: Missing SKILL.md"
              errors=$((errors + 1))
            else
              # Check frontmatter has required fields
              for field in name description license; do
                if ! head -20 "$skill_dir/SKILL.md" | grep -q "^${field}:"; then
                  echo "::error::$skill_name: SKILL.md missing '$field' in frontmatter"
                  errors=$((errors + 1))
                fi
              done
            fi

            # LICENSE must exist
            if [ ! -f "$skill_dir/LICENSE.txt" ] && [ ! -f "$skill_dir/LICENSE" ]; then
              echo "::error::$skill_name: Missing LICENSE.txt or LICENSE"
              errors=$((errors + 1))
            fi

            # No files over 100KB (skills should be lightweight)
            while IFS= read -r large_file; do
              echo "::warning::$skill_name: Large file $(du -h "$large_file" | cut -f1) - $large_file"
            done < <(find "$skill_dir" -type f -size +100k 2>/dev/null)

            echo "::endgroup::"
          done

          if [ $errors -gt 0 ]; then
            echo "::error::Validation failed with $errors error(s)"
            exit 1
          fi
          echo "✅ All skills validated"

      - name: Check markdown links
        run: |
          errors=0
          for md_file in $(find skills/ -name '*.md'); do
            # Check relative links point to existing files
            dir=$(dirname "$md_file")
            while IFS= read -r link; do
              target="$dir/$link"
              if [ ! -f "$target" ] && [ ! -d "$target" ]; then
                echo "::warning file=$md_file::Broken link: $link"
              fi
            done < <(grep -oP '\[.*?\]\(\K[^)]+' "$md_file" | grep -v '^http' | grep -v '^#')
          done
          echo "✅ Link check complete"
